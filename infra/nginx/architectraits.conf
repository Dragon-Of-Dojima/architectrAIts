# Reverse-proxy config for the host's existing nginx.
#
# Install on the instance:
#   sudo cp infra/nginx/architectraits.conf /etc/nginx/sites-available/architectraits.andrewtimothydev.com
#   sudo ln -s /etc/nginx/sites-available/architectraits.andrewtimothydev.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d architectraits.andrewtimothydev.com
#
# certbot will rewrite this server block to listen on 443 with the cert and add
# an HTTP->HTTPS redirect automatically.

server {
    listen 80;
    listen [::]:80;
    server_name architectraits.andrewtimothydev.com;

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
