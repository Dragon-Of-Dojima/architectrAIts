# Production stack for a single Lightsail instance:
#   Postgres (pgvector) + Redis + Next app (standalone).
#
# TLS/ingress is handled by the host's existing nginx, which reverse-proxies the
# subdomain to the web container published on 127.0.0.1:3300 (see infra/nginx/).
#
# Usage (from repo root), always passing the prod env file so that ${VARS}
# below interpolate correctly:
#
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file infra/docker/.env.prod up -d --build
#
# One-off DB migrate + seed (reads S3 to (re)build the catalog):
#
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file infra/docker/.env.prod --profile tools run --rm migrator
#
# One-off AI ingest (Phase 2a vision metadata). Run AFTER migrator so the new
# buildings columns exist, and only once OPENROUTER_API_KEY is set in .env.prod:
#
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file infra/docker/.env.prod --profile tools run --rm ingest
#
# One-off image embeddings (Phase 2b). Run AFTER migrator (needs the embedding
# column + HNSW index from migration 0002) and is idempotent (only rows where
# embedding IS NULL). The SigLIP model (~350MB) is cached in the hf_cache volume
# on first run, so re-runs don't re-download it:
#
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file infra/docker/.env.prod --profile tools run --rm embed
#
# Full run order on a fresh box:  migrator (migrate + seed) -> ingest -> embed

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: architectraits-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-architect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-architectraits}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Enables the pgvector extension on first init (Phase 2).
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-architect} -d ${POSTGRES_DB:-architectraits}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: architectraits-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runner
    container_name: architectraits-web
    restart: unless-stopped
    # Supplies S3_BUCKET, AWS_REGION, and AWS credentials to the app.
    env_file: .env.prod
    environment:
      # Internal compose network hostname; overrides anything in .env.prod.
      DATABASE_URL: postgresql://${POSTGRES_USER:-architect}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-architectraits}
      # Where the web BFF route (/api/analyze) forwards uploads for inference.
      # Reachable over the compose network by service name; not published.
      ANALYZE_API_URL: http://api:3301
    depends_on:
      postgres:
        condition: service_healthy
    # Published on localhost only; the host's nginx reverse-proxies to it.
    # Not exposed publicly (the Lightsail firewall doesn't open 3300 anyway).
    ports:
      - '127.0.0.1:3300:3300'

  # Long-running inference service for the visitor upload-and-analyze feature.
  # The web BFF (apps/web/app/api/analyze/route.ts) POSTs raw image bytes here;
  # this service runs describeBuilding (OpenRouter) + embedImageFromBlob (local
  # SigLIP) and returns { analysis, embedding }. Stateless: no DB, no S3.
  #
  # Uses the build image (source + tsx + the architectraits-ai dep with
  # onnxruntime-node) and runs via tsx, mirroring the tools services — this
  # sidesteps bundling onnxruntime's native binaries into a compiled artifact.
  # Internal only: no published ports; web reaches it at http://api:3301.
  #
  # Memory note: this holds the ~350MB SigLIP model resident once the first
  # upload loads it. On the 2GB box that competes with web/postgres — the 4GB
  # swap is the safety valve. The model is cached in the shared hf_cache volume
  # (populated by the embed tool), so it isn't re-downloaded here.
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: build
    container_name: architectraits-api
    restart: unless-stopped
    # Supplies OPENROUTER_API_KEY + OPENROUTER_VISION_MODEL (shared with ingest).
    env_file: .env.prod
    environment:
      PORT: '3301'
      HF_CACHE_DIR: /app/.hf-cache
    volumes:
      - hf_cache:/app/.hf-cache
    command: ['sh', '-c', 'pnpm --filter api exec tsx src/index.ts']

  # Run on demand only (profile: tools). Uses the build image, which has the
  # source + dev deps (drizzle-kit, tsx) needed for migrations + seeding.
  migrator:
    profiles: ['tools']
    build:
      context: ../..
      dockerfile: Dockerfile
      target: build
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-architect}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-architectraits}
    depends_on:
      postgres:
        condition: service_healthy
    command: ['sh', '-c', 'pnpm --filter architectraits-db migrate && pnpm --filter architectraits-db seed']

  # Run on demand only (profile: tools). Calls OpenRouter for vision metadata on
  # every building with a null ai_processed_at, so it's idempotent and safe to
  # re-run. Inherits S3_BUCKET/AWS_*/OPENROUTER_* from .env.prod via env_file.
  # Run AFTER migrator (needs the new buildings columns) and after credits are
  # funded. Uses the build image (source + tsx + ai deps).
  ingest:
    profiles: ['tools']
    build:
      context: ../..
      dockerfile: Dockerfile
      target: build
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-architect}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-architectraits}
    depends_on:
      postgres:
        condition: service_healthy
    command: ['sh', '-c', 'pnpm --filter architectraits-db ingest']

  # Run on demand only (profile: tools). Computes a SigLIP image embedding for
  # every building where embedding IS NULL (idempotent, safe to re-run). Runs
  # locally on CPU via @huggingface/transformers + onnxruntime-node (the npm
  # package bundles the linux/x64 CPU binary, so pnpm-10's "Ignored build
  # scripts" warning for onnxruntime-node is harmless here — that script only
  # fetches the CUDA EP, which this CPU-only box doesn't want).
  #
  # The ~350MB model is cached in the named hf_cache volume so it isn't
  # re-downloaded on every run. transformers.js does NOT honor HF_HOME; the
  # embed code reads HF_CACHE_DIR and sets env.cacheDir to it (see packages/ai).
  # Run AFTER migrator (needs the embedding column + HNSW index). Uses the build
  # image (source + tsx + ai deps).
  embed:
    profiles: ['tools']
    build:
      context: ../..
      dockerfile: Dockerfile
      target: build
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-architect}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-architectraits}
      HF_CACHE_DIR: /app/.hf-cache
    volumes:
      - hf_cache:/app/.hf-cache
    depends_on:
      postgres:
        condition: service_healthy
    command: ['sh', '-c', 'pnpm --filter architectraits-db embed']

volumes:
  pg_data:
  redis_data:
  hf_cache:
